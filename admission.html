<h2>Student Registration Form</h2>

<form>

<!-- Student Name -->

<label for="studentName" class="box">

Student Name

</label>

<br><br>

<input
type="text"
id="studentName"
name="studentName"
placeholder="Enter Student Name"
required>

<br><br>

<!-- Father Name -->

<label for="fatherName">

Father Name

</label>

<br><br>

<input
type="text"
id="fatherName"
name="fatherName"
placeholder="Enter Father Name"
required>

<br><br>

<!-- Mother Name -->

<label for="motherName">

Mother Name

</label>

<br><br>

<input
type="text"
id="motherName"
name="motherName"
placeholder="Enter Mother Name">

<br><br>

<!-- Gender -->

<label>

Gender

</label>

<br><br>

<input
type="radio"
name="gender"
value="Male">

Male

<input
type="radio"
name="gender"
value="Female">

Female

<br><br>

<!-- Date of Birth -->

<label for="dob">

Date of Birth

</label>

<br><br>

<input
type="date"
id="dob"
name="dob">

<br><br>

<!-- Mobile -->

<label for="mobile">

Mobile Number

</label>

<br><br>

<input
type="text"
id="mobile"
name="mobile"
pattern="[0-9]{10}"
placeholder="Enter 10 Digit Mobile">

<br><br>

<!-- Email -->

<label for="email">

Email

</label>

<br><br>

<input
type="email"
id="email"
name="email"
placeholder="Enter Email">

<br><br>

<!-- Aadhaar -->

<label for="aadhaar">

Aadhaar Number

</label>

<br><br>

<input
type="text"
id="aadhaar"
name="aadhaar"
placeholder="Enter Aadhaar Number">

<br><br>

<!-- Blood Group -->

<label for="blood">

Blood Group

</label>

<br><br>

<select
id="blood"
name="blood">

<option>Select Blood Group</option>

<option>A+</option>

<option>A-</option>

<option>B+</option>

<option>B-</option>

<option>AB+</option>

<option>AB-</option>

<option>O+</option>

<option>O-</option>

</select>

<br><br>

<!-- Course -->

<label for="course">

Select Course

</label>

<br><br>

<select
id="course"
name="course">

<option>DCA</option>

<option>ADCA</option>

<option>Tally</option>

<option>Python</option>

<option>Java</option>

<option>Full Stack</option>

<option>Advanced Excel</option>

</select>

<br><br>

<!-- Address -->

<label for="address">

Address

</label>

<br><br>

<textarea
id="address"
name="address"
rows="5"
cols="40"
placeholder="Enter Address">

</textarea>

<br><br>

<!-- Student Photo -->

<label>

Student Photo

</label>

<br><br>

<input
type="file"
accept="image/*">

<br><br>

<!-- Documents -->

<label>

Certificates

</label>

<br><br>

<input
type="file"
multiple>

<br><br>

<!-- Buttons -->

<input class="button"
type="submit"
value="Register Student">

<input class="button"
type="reset"
value="Clear Form">

</form>
